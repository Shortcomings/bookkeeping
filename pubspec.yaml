name: bookkeeping
description: "一款纯净、智能的个人记账工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2

  # 本地数据库
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # 图表
  fl_chart: ^0.70.2

  # 数据导出
  excel: ^4.0.6
  share_plus: ^10.1.4
  csv: ^6.0.0

  # 工具
  intl: ^0.20.2
  uuid: ^4.5.1
  sqflite_common_ffi_web: ^1.1.1
  sqflite_common: ^2.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
